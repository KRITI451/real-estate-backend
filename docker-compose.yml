services:
  db:
    image: postgis/postgis:16-3.4
    container_name: real_estate_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    volumes:
      - real_estate_data:/var/lib/postgresql/data
    networks:
      - rental-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: real_estate_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    env_file:
      - ./server/.env
    networks:
      - rental-service-net
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-service-net

  # 🛠 MinIO Initialization (Create bucket)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/properties || true;
      exit 0;
      "
    networks:
      - rental-service-net

volumes:
  real_estate_data:
  minio_data:

networks:
  rental-service-net:
    driver: bridge
  